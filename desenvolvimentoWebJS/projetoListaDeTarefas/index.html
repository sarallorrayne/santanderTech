<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="//use.fontawesome.com/releases/v6.7.2/css/all.css">
    <title>Lista de Tarefas</title>
</head>
<body>
    <header></header>

    <main>
        <h1>Lista de Tarefas</h1>

        <section>
            <form id="todo-form">
                <input type="text" placeholder="Digite uma tarefa" id="task-title-input">
                <button type="submit" id="add-button">Adicionar</button>
            </form>
        </section>

        <section>
            <ul id="todo-list">
            </ul>
        </section>
    </main>

    <footer></footer>

    <script src="index.js"></script>
</body>
</html>
